#
# Projektkonfiguration der Release-Schritte (Projektwebsite des Grundschutz++ Explorers).
# Jeder Schritt unter steps/ liest den Abschnitt, der seinem Dateinamen ohne Nummer entspricht
# (steps/30-security-txt.py → [security_txt]). Pfade sind relativ zum Projektordner.

# Projektordner, relativ zu dieser Datei
root = "../.."

[release]
# Tag des Releases, Platzhalter {version}; erscheint in der Abschlussmeldung
tag = "v{version}"

[version]
# Die Version steht nur im Changelog: der Schritt prüft nur das Format
files = []

[changelog]
file = "CHANGELOG.md"

[security_txt]
file = "www/.well-known/security.txt"

[screenshots]
# Aufgenommen wird die veröffentlichte App; zum Testen einer lokalen Instanz RELEASE_SCREENSHOTS_URL setzen
url = "https://app.grundschutz-explorer.de/"
scenes = "project/scenes.py"
# Das Manifest liegt bei den Bildern; neue Szenen in project/scenes.py ergänzen
jobs = [{ name = "website", out_dir = "www/media/screens", manifest = "www/media/screens/manifest.json" }]
